name: Callory Tracker CICD Workflow

on:
  push:
    branches:
      - "feat/*"
      - "fix/*"
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to push (commit SHA) or default 'latest'"
        required: false
        default: "latest"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: bixoloo/callory-tracker

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.20"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -vet=off ./...

  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          # labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify pushed image
        run: |
          echo "**** Pushed images ****"
          echo " --> ${{ env.IMAGE_NAME}}:${{ github.sha }}"
          echo " --> ${{ env.IMAGE_NAME}}:latest"

  deploy:
    name: Deploy to VM || EC2 Instance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="latest"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Will deploy image tagged: $TAG"

      - name: Ensure the deployment directory exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          script: |
            set -euo pipefail

            DEPLOY_DIR=${{ secrets.DEPLOY_PATH }}

            if [ -d "${DEPLOY_DIR}" ]; then
              echo "Deploy directory exists: ${DEPLOY_DIR}"
            else
              echo "Deploy dir does not exist. Creating one ...!"
              mkdir -p "${DEPLOY_DIR}"
            fi

            echo "Directory ready:"
            ls -la "${DEPLOY_DIR}"

      - name: Copy the deployment files to the VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          source: "docker-compose.prod.yml"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Pull the image and restart the stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          DOCKER_IMAGE: ${{ env.IMAGE_NAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          envs: IMAGE_TAG,DOCKER_IMAGE,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -euo pipefail

            DEPLOY_DIR=${{ secrets.DEPLOY_PATH }}
            cd "${DEPLOY_DIR}"

            if [ ! -f ".env" ]; then
              echo "::error::.env not provided in ${DEPLOY_DIR}. Create file before proceeding"
              exit 1
            fi

            echo "Directory ready:"
            ls -la "${DEPLOY_DIR}"

            # Make the image tag available for docker-compose
            export DOCKER_IMAGE="${DOCKER_IMAGE}"
            export IMAGE_TAG="${IMAGE_TAG:-latest}"

            echo "Image to deploy: ${DOCKER_IMAGE}:${IMAGE_TAG}"

            echo "Logging into image registry..."
            echo "${DOCKERHUB_TOKEN}" | docker login \
              -u "${DOCKERHUB_USERNAME}" --password-stdin

            echo "Pulling latest image tag '${IMAGE_TAG}' from registry"
            docker compose -f docker-compose.prod.yml \
              --env-file .env pull

            echo "Starting/recreating the application stack..."
            docker compose -f docker-compose.prod.yml \
              --env-file .env up -d --remove-orphans

            echo "Cleaning up dangling images..."
            docker image prune -f

            echo "Current running containers"
            docker compose -f docker-compose.prod.yml \
              --env-file .env ps

            echo "Deployment complete."
